<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping it at 1 stopped phones pinch-zooming the
         page at all, which fails WCAG 1.4.4 and is the one thing a parent
         reading small print on a handset is most likely to reach for.
         viewport-fit=cover keeps env(safe-area-inset-*) usable so the fixed
         call widget can clear the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vivekananda Concept School</title>
    <meta name="description" content="Vivekananda Concept School — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Vivekananda Concept School" />
    <meta property="og:description" content="Vivekananda Concept School — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vivekananda Concept School" />
    <meta name="twitter:description" content="Vivekananda Concept School — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
